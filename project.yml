name: FJTranslate

options:
  bundleIdPrefix: com.fjtranslate
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  FJTranslate:
    type: application
    platform: iOS
    sources:
      - path: FJTranslate
    info:
      path: FJTranslate/Info.plist
      properties:
        CFBundleDisplayName: FJ Translate
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.reference
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_NAME: FJTranslate
        PRODUCT_BUNDLE_IDENTIFIER: com.fjtranslate.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
