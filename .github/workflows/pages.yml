name: Prepare Nousa Translator offline files

# Pages is configured to publish main/docs, so this workflow prepares the files
# and commits them to main. GitHub Pages then publishes them automatically.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-nousa-offline-files
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install libraries
        run: |
          set -e
          mkdir -p /tmp/libs
          cd /tmp/libs
          npm init -y >/dev/null
          npm install --no-audit --no-fund @huggingface/transformers@3 tesseract.js@6 esbuild
          npm install --no-audit --no-fund @tesseract.js-data/eng @tesseract.js-data/ara || true

      - name: Build translation bundle and copy ONNX runtime files
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/docs/vendor"
          mkdir -p "$V/ort"
          printf "%s\n" "export { pipeline, env } from '@huggingface/transformers';" > /tmp/libs/entry.mjs

          /tmp/libs/node_modules/.bin/esbuild /tmp/libs/entry.mjs \
            --bundle --format=esm --platform=browser --minify \
            --log-level=warning --outfile="$V/transformers.bundle.js"

          ORT_PKG="$(find /tmp/libs/node_modules -path '*/onnxruntime-web/package.json' -print -quit)"
          if [ -z "$ORT_PKG" ]; then
            echo "ERROR: Could not find onnxruntime-web package"
            exit 1
          fi
          ORT_DIR="$(dirname "$ORT_PKG")/dist"
          find "$ORT_DIR" -maxdepth 1 -type f \( -name 'ort-wasm*.wasm' -o -name 'ort-wasm*.mjs' \) -exec cp -t "$V/ort" {} +
          test -n "$(find "$V/ort" -type f -print -quit)"

      - name: Copy OCR engine and Arabic/English language data
        run: |
          set -euo pipefail
          V="$GITHUB_WORKSPACE/docs/vendor"
          TESS="$V/tesseract"
          DATA="$V/tessdata"
          mkdir -p "$TESS" "$DATA"

          cp /tmp/libs/node_modules/tesseract.js/dist/tesseract.min.js "$TESS/"
          cp /tmp/libs/node_modules/tesseract.js/dist/worker.min.js "$TESS/"

          CORE_PKG="$(find /tmp/libs/node_modules -path '*/tesseract.js-core/package.json' -print -quit)"
          if [ -z "$CORE_PKG" ]; then
            echo "ERROR: Could not find tesseract.js-core package"
            exit 1
          fi
          CORE="$(dirname "$CORE_PKG")"
          cp "$CORE"/tesseract-core*.wasm.js "$TESS/"
          cp "$CORE"/tesseract-core*.wasm "$TESS/" 2>/dev/null || true

          for L in eng ara; do
            F="$(find "/tmp/libs/node_modules/@tesseract.js-data/$L" -name "$L.traineddata.gz" -print 2>/dev/null | grep 'best_int' | head -n 1 || true)"
            if [ -z "$F" ]; then
              F="$(find "/tmp/libs/node_modules/@tesseract.js-data/$L" -name "$L.traineddata.gz" -print -quit 2>/dev/null || true)"
            fi
            if [ -n "$F" ]; then
              cp "$F" "$DATA/$L.traineddata.gz"
            else
              curl -fL --retry 3 "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$L.traineddata" -o "/tmp/$L.traineddata"
              gzip -9 -c "/tmp/$L.traineddata" > "$DATA/$L.traineddata.gz"
            fi
            test -s "$DATA/$L.traineddata.gz"
          done

      - name: Verify required files
        run: |
          set -e
          test -s docs/vendor/transformers.bundle.js
          test -s docs/vendor/tesseract/tesseract.min.js
          test -s docs/vendor/tesseract/worker.min.js
          test -s docs/vendor/tessdata/eng.traineddata.gz
          test -s docs/vendor/tessdata/ara.traineddata.gz
          find docs/vendor -maxdepth 3 -type f -printf '%p (%s bytes)\n' | sort
          du -sh docs/vendor

      - name: Commit generated files to main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/vendor
          if git diff --cached --quiet; then
            echo "No generated files changed; nothing to commit."
            exit 0
          fi
          git commit -m "Prepare offline translation and OCR libraries"
          git push origin HEAD:main
